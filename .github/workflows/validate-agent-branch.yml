name: Validate agent branch

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "hotfix/**"

env:
  DATABASE_URL: "file:./dev.db"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  AUTH_SECRET: "ci-secret-placeholder"
  AUTH_TRUST_HOST: "true"

jobs:
  validate:
    name: Validate agent branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Success
        if: success()
        run: echo "✓ Agent branch validated successfully"
