name: Promote development to staging

on:
  workflow_dispatch:

env:
  DATABASE_URL: "file:./dev.db"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  AUTH_SECRET: "ci-secret-placeholder"
  AUTH_TRUST_HOST: "true"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Checkout staging
        run: git checkout staging

      - name: Merge development
        run: 'git merge --no-ff origin/development -m "chore: merge development to staging [ci-skip]"'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Push staging
        if: success()
        run: git push origin staging

      - name: Notify
        if: success()
        run: echo "✓ Successfully promoted development to staging"

      - name: Notify failure
        if: failure()
        run: |
          echo "✗ Promotion failed"
          echo "Merge may have conflicts. Resolve manually."
        continue-on-error: true
